<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إلى رفيقة الروح - أسامة</title>
    <style>
        @import url('https://googleapis.com');

        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle, #1a0505 0%, #000000 100%);
            height: 100vh; display: flex;
            justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Amiri', serif;
        }

        /* بتلات دم الغزال في المواجهة - حركة مستمرة فقط */
        .petal {
            position: absolute;
            background: #8b0000;
            border-radius: 150% 0 150% 0;
            animation: fall linear infinite; /* حركة مستمرة للأبد */
            opacity: 0.9;
            z-index: 100;
            pointer-events: none;
            box-shadow: 0 0 8px rgba(0,0,0,0.6);
        }

        @keyframes fall {
            0% { top: -10%; transform: translateX(0) rotate(0deg); }
            100% { top: 110%; transform: translateX(200px) rotate(720deg); }
        }

        .frame {
            position: relative;
            padding: 90px 60px 70px;
            border: 1.5px solid rgba(212, 175, 55, 0.4);
            background: rgba(10, 5, 5, 0.95);
            box-shadow: 0 0 120px rgba(139, 0, 0, 0.3);
            max-width: 650px; text-align: center;
            border-radius: 5px; animation: fadeIn 3s ease-in-out;
            z-index: 10;
        }

        /* الريشة وزر الموسيقى تحتها */
        .header-section {
            position: absolute;
            top: -50px; left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .feather {
            font-size: 50px;
            filter: sepia(1);
            animation: float 4s infinite ease-in-out;
        }

        #music-btn {
            background: none; border: 1px solid #d4af37;
            color: #d4af37; font-family: 'Amiri', serif;
            padding: 5px 15px; cursor: pointer;
            font-size: 0.9em; border-radius: 20px;
            transition: 0.3s; background: rgba(0,0,0,0.5);
        }
        #music-btn:hover { background: #d4af37; color: black; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(10deg); }
        }

        .poetry { font-size: 2.2em; color: #ffffff; line-height: 1.8; margin-bottom: 30px; }
        .verse { display: block; opacity: 0; transform: translateY(20px); animation: appear 2s forwards; }
        .verse:nth-child(1) { animation-delay: 0.5s; }
        .verse:nth-child(2) { animation-delay: 2.5s; }

        .message {
            font-family: 'Aref Ruqaa', serif; font-size: 1.6em;
            color: #d4af37; margin-top: 20px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            padding-top: 20px; opacity: 0;
            animation: fadeIn 2s forwards 4s;
        }

        .signature-corner {
            position: absolute; bottom: 25px; left: 40px;
            opacity: 0; animation: fadeIn 2s forwards 5s;
        }

        .handwritten-sig {
            font-family: 'Mrs Saint Delafield', cursive;
            font-size: 3.5em; color: #d4af37;
            display: block; transform: rotate(-10deg);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes appear { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <audio id="bg-audio" loop>
        <source src="https://soundhelix.com" type="audio/mpeg">
    </audio>

    <div class="frame">
        <div class="header-section">
            <span class="feather">🪶</span>
            <button id="music-btn" onclick="document.getElementById('bg-audio').play(); this.innerText='🎵 يعزف الآن';">تشغيل اللحن</button>
        </div>

        <div class="poetry">
            <span class="verse">لَقَد كُنتُ أَطوِي الشَّوقَ حَتَّى غَلَبنِي</span>
            <span class="verse">فَيا لَيتَ مَن نَهواهُ بِالوَصلِ يُسعِفُ</span>
        </div>

        <div class="message">
            إلى مَن غابَت لِطلبِ العِلمِ.. <br>
            ننتظرُ بزوغَ فجرِكِ من جديد بعد عناءِ الدّرس.
        </div>

        <div class="signature-corner">
            <span class="handwritten-sig">Osama</span>
        </div>
    </div>

    <script>
        // إنشاء عدد كبير من البتلات (40 بتلة) لزيادة الكثافة
        const petalCount = 40;
        const container = document.body;

        for (let i = 0; i < petalCount; i++) {
            let p = document.createElement('div');
            p.className = 'petal';
            
            // توزيع عشوائي للبداية والسرعة
            const startLeft = Math.random() * 100;
            const duration = Math.random() * 5 + 5; // بين 5 و 10 ثواني
            const delay = Math.random() * -10; // تأخير بالسالب لتبدأ من أماكن مختلفة فوراً

            p.style.left = startLeft + 'vw';
            p.style.animationDuration = duration + 's';
            p.style.animationDelay = delay + 's';
            
            // أحجام متفاوتة
            const size = Math.random() * 15 + 15;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            
            container.appendChild(p);
        }
    </script>
</body>
</html>
